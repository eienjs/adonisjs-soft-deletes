name: Notify docs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch or tag) to sync docs from (defaults to current branch)
        required: false
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch docs sync
        env:
          GH_TOKEN: ${{ secrets.DOCS_SYNC_TOKEN }}
          PACKAGE: ${{ github.event.repository.name }}
          REF: ${{ github.event.release.tag_name || inputs.ref || github.ref_name }}
        run: |
          gh api repos/eienjs/docs/dispatches \
            -f event_type=package-docs-updated \
            -f "client_payload[package]=$PACKAGE" \
            -f "client_payload[ref]=$REF" \
            -f "client_payload[version]=$REF"
